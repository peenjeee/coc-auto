name: Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (for example 0.1.0)'
        required: true
        default: '0.1.0'
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: python -m pip install --require-hashes -r packaging/requirements-build.txt
      - name: Install application
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Python tests
        run: python -m unittest discover -s tests/python
      - name: Browser tests
        shell: pwsh
        run: node --test (Get-ChildItem tests/web/test_*.mjs).FullName
      - name: Select version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][A-Za-z0-9.]+)?$') { throw 'Invalid version' }
          "COC_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and smoke-test package
        run: python packaging/build_windows.py $env:COC_RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/coc-auto-*-windows-x64.zip
            dist/*.sha256
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "CoC Auto $RELEASE_TAG"
